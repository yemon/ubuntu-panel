<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPS Manager · Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 35px; width: 100%; max-width: 380px; }
        .login-card h1 { text-align: center; color: #38bdf8; font-size: 1.6rem; margin-bottom: 8px; }
        .login-card p { text-align: center; color: #64748b; font-size: 0.85rem; margin-bottom: 25px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #94a3b8; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 11px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #f1f5f9; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: #38bdf8; }
        .btn-login { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 600; background: #2563eb; color: white; transition: background 0.2s; }
        .btn-login:hover { background: #1d4ed8; }
        .error { background: #991b1b; color: #fca5a5; padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 18px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🖥️ VPS Manager</h1>
        <p>Sign in to continue</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" autofocus required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>
</body>
</html>
